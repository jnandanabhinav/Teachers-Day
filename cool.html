<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Teacher's Day Greeting</title>
  <link rel="stylesheet" href="cool-style.css">
</head>
<body>

  <!-- Floating Starry Background and Confetti Layers -->
  <canvas id="bg-canvas"></canvas>
  <canvas id="confetti-canvas"></canvas>

  <div class="card-container">
    <div class="glow-wrapper"></div>
    <div class="premium-card" id="main-card">
      <div class="badge">✨ Honor & Respect ✨</div>
      <div class="icon-orb">🎓</div>
      <h1 class="gradient-title">Happy Teacher's Day!</h1>
      
      <!-- This text will dynamically type itself out -->
      <div class="typing-container">
        <p id="typing-quote"></p><span class="cursor">|</span>
      </div>

      <p class="tap-hint">Tap anywhere to launch celebration rockets!</p>
    </div>
  </div>

  <script src="cool-script.js"></script>
</body>
</html>
